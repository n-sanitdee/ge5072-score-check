<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>GE5072 Score Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f6fb; --card:#ffffff; --line:#e3e7f0; --ink:#0f172a; --ink2:#475569; --muted:#8a94a6;
  --blue:#2563eb; --cyan:#0891b2; --orange:#ea580c; --green:#059669; --amber:#d97706; --pink:#db2777; --violet:#7c3aed;
  --ok:#059669; --no:#dc2626; --wait:#b45309;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Sarabun,Thonburi,"Leelawadee UI",sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
.strip{height:5px;background:linear-gradient(90deg,var(--blue),var(--violet),var(--pink),var(--orange),var(--amber),var(--green))}
main{max-width:1080px;margin:0 auto;padding:14px 16px 16px}
.layout{display:grid;gap:12px}
@media (min-width:900px){
  main{padding:22px 24px}
  .layout.has-result{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start;column-gap:20px}
}
.kicker{font-size:13px;font-weight:600;color:var(--ink2);margin:0;letter-spacing:.01em}
h1{font-size:25px;font-weight:800;line-height:1.15;margin:1px 0 9px;letter-spacing:-.01em}
h1 span{color:var(--blue);font-weight:700}
form{display:flex;gap:8px}
#code{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  background:var(--card);border:1.5px solid #cdd4e2;border-radius:12px;padding:9px 14px;outline:0}
#code::placeholder{text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:16px}
#code:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:0 20px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--violet))}
button:disabled{opacity:.6;cursor:wait}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--ink2)}
.meta .upd{font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.has-result .hint,.has-result .meta{display:none}
.msg{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:14px}
.msg:empty{display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sum{margin-top:12px;padding:12px 14px;background:linear-gradient(135deg,#eef4ff 0%,#f4efff 100%);border-color:#d9e2fb}
.sum-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who{font-weight:800;font-size:16px}
.stamp{font-size:11.5px;color:var(--ink2);font-weight:600}
.who small{font-weight:600;color:var(--ink2);font-size:14px}
.demo{font-size:12px;font-weight:700;color:#7c2d12;background:#fde68a;border-radius:999px;padding:2px 9px}
.bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);text-align:right;line-height:1.25;padding-bottom:4px}
.big{font-size:40px;font-weight:800;line-height:1.05;color:#1e3a8a;font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--ink2);font-weight:700}
.bar{height:10px;border-radius:5px;background:#dfe5f3;overflow:hidden;display:flex;margin:6px 0 6px}
.bar i{display:block;height:100%}
.eq{font-size:12.5px;color:var(--ink2)}
.eq b{color:var(--ink)}
.wait-line{font-size:12.5px;color:var(--wait);margin-top:3px;font-weight:600}

.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{border-radius:11px;padding:7px 9px 7px;background:color-mix(in srgb,var(--c) 7%,#fff);border:1px solid color-mix(in srgb,var(--c) 22%,#fff);
  display:flex;flex-direction:column;gap:2px;min-width:0}
.t-lbl{font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.2}
.t-val{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-val small{font-size:12px;color:var(--muted);font-weight:600}
.t-val.pend{color:var(--wait);font-size:15px}
.t-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--c) 18%,#fff);overflow:hidden;margin-top:auto}
.t-bar i{display:block;height:100%;background:var(--c)}
.tag{font-size:11px;font-weight:700;line-height:1.3}
.tag.ok{color:var(--ok)} .tag.no{color:var(--no)} .tag.wait{color:var(--wait)}

.bonus{margin-top:10px;padding:10px 12px;border-color:color-mix(in srgb,var(--violet) 25%,#fff);background:color-mix(in srgb,var(--violet) 4%,#fff)}
.b-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.b-name{font-weight:700;font-size:14px}
.b-name small{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.b-val{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.b-val small{color:var(--muted);font-weight:600;font-size:12px}
.b-val .plus{color:var(--violet)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;margin:6px 0 7px}
.chip{display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:2px 2px 3px;white-space:nowrap;line-height:1.2;
  border:1px solid var(--line);color:var(--muted);background:#fff}
.chip b{font-size:12px}.chip small{font-size:10.5px;font-weight:600}
.chip.done{background:color-mix(in srgb,var(--green) 12%,#fff);border-color:color-mix(in srgb,var(--green) 40%,#fff);color:#065f46}
.chip.part{grid-column:span 2}
.pend{color:var(--wait)}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<main>
  <div class="layout" id="layout">
    <div class="left">
      <p class="kicker">GE5072 / GE072 · ภาคเรียนที่ 1/2569</p>
      <h1>เช็คคะแนน <span>Score Check</span></h1>
      <form id="f" autocomplete="off">
        <input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="40"
               placeholder="ใส่ Code เช่น S-XXXX" aria-label="Code ของคุณ เช่น S-XXXX">
        <button id="go" type="submit">ดูคะแนน</button>
      </form>
      <div class="meta"><span class="upd" id="updated" hidden></span></div>
      <p class="hint">🔒 ใช้ Code ที่ได้รับทาง Teams chat · ถอดรหัสคะแนนในเครื่องของคุณเท่านั้น · อย่าบอก Code ต่อนะคะ</p>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <div id="summary" aria-live="polite"></div>
    </div>
    <div class="right" id="detail"></div>
  </div>
</main>

<script>
(() => {
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const $ = (s) => document.querySelector(s);
  const msg = (t) => { $("#msg").textContent = t || ""; };
  let dataPromise = null;

  const loadData = () => dataPromise ||= fetch("scores.enc.json?" + Date.now(), { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch((e) => { dataPromise = null; throw e; });

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");

  function normalise(raw) {
    const up = (raw || "").toUpperCase();
    // A pasted line such as "Code: S-AB2C" still works: take the S-XXXX inside it.
    const m = up.match(/(?:^|[^A-Z0-9])S\s*[-–]\s*([A-Z0-9]{4})(?![A-Z0-9])/);
    let s = m ? m[1] : up.replace(/[\s\-–_.]/g, "");
    if (s.length === 5 && s[0] === "S") s = s.slice(1);
    if (s.length !== 4) return { err: "Code มี 4 ตัวหลัง S- เช่น S-XXXX ลองตรวจอีกครั้งนะคะ" };
    if (/[O0I1]/.test(s)) return { err: "Code ไม่มีตัว O, 0, I หรือ 1 ค่ะ ลองเทียบกับข้อความที่ได้รับอีกครั้ง" };
    if ([...s].some((c) => !ALPHABET.includes(c))) return { err: "Code มีได้เฉพาะตัวอักษรภาษาอังกฤษและตัวเลข 2–9 ค่ะ" };
    return { code: "S-" + s };
  }

  async function openRecord(data, code) {
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: b64(data.salt), iterations: data.iter },
      await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveBits"]),
      384);
    const id = hex(bits.slice(32));
    const hit = data.records[id];
    if (!hit) return null;
    const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(hit[0]) }, key, b64(hit[1]));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
  const fmt = (x) => (Math.round(x * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 });
  const isNum = (v) => typeof v === "number";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const TH_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  function thaiDate(iso) {
    const [d, t] = iso.split("T"); const [y, m, dd] = d.split("-").map(Number);
    return `${dd} ${TH_MONTHS[m - 1]} ${y + 543}${t ? " เวลา " + t + " น." : ""}`;
  }

  // คะแนนเก็บ (อาจารย์ไทย) = 45, as announced in Teams on 26 Nov 2026. Order = tile order (3 per row).
  const ITEMS = [
    { k: "att",   name: "เข้าเรียน", max: 10, c: "var(--blue)" },
    { k: "eval",  name: "ประเมินการสอน", max: 2.5, c: "var(--cyan)" },
    { k: "quiz",  name: "Pop Quiz", max: 5, c: "var(--amber)" },
    { k: "a1",    name: "Assignment 1", max: 2.5, c: "var(--orange)", sub: true },
    { k: "a2",    name: "Assignment 2", max: 2.5, c: "var(--orange)", sub: true },
    { k: "a3",    name: "Assignment 3", max: 2.5, c: "var(--orange)", sub: true },
    { k: "fp",    name: "Final Project", max: 10, c: "var(--green)" },
    { k: "busuu", name: "Busuu", max: 10, c: "var(--pink)" },
  ];
  // Until the presentation marks are entered, the Final Projects column holds the report only (out of 8).
  const itemsFor = (data) => !data.fpSplit ? ITEMS : ITEMS.flatMap((it) => it.k !== "fp" ? [it] : [
    { ...it, name: "Report", max: 8 },
    { k: "fpPres", name: "Presentation", max: 2, c: "var(--green)", soon: true },
  ]);

  function render(data, code, rec) {
    const pending = new Set(data.pending || []);
    let base = 0;
    const waiting = [];
    const tiles = itemsFor(data).map((it) => {
      const v = rec[it.k];
      let val, tag = "", pct = 0, pend = false;
      if (it.soon) {
        pend = true; val = `เร็ว ๆ นี้ <small>/ ${it.max}</small>`;
        tag = '<span class="tag wait">ยังไม่รวม</span>';
        waiting.push("Presentation");
      } else if (pending.has(it.k)) {
        pend = true; val = `รอบันทึก <small>/ ${it.max}</small>`;
        waiting.push(it.name);
      } else if (isNum(v)) {
        base += v; pct = v / it.max;
        val = `${fmt(v)}<small> / ${it.max}</small>`;
        if (it.sub && v <= 0) tag = '<span class="tag no">ไม่พบการส่ง</span>';
      } else if (typeof v === "string" && v) {
        pend = true; val = `รอตรวจ <small>/ ${it.max}</small>`;
        tag = '<span class="tag wait">ส่งแล้ว</span>';
        waiting.push(it.name);
      } else {
        val = `0<small> / ${it.max}</small>`;
        if (it.sub) tag = '<span class="tag no">ไม่พบการส่ง</span>';
        else if (it.k === "fp") tag = '<span class="tag no">ยังไม่มีคะแนน</span>';
      }
      return `<div class="tile" style="--c:${it.c}">
        <div class="t-lbl">${esc(it.name)}</div>
        <div class="t-val${pend ? " pend" : ""}">${val}</div>${tag}
        <div class="t-bar"><i style="width:${Math.min(100, pct * 100).toFixed(1)}%"></i></div></div>`;
    }).join("");
    base = r2(base);

    const A_TOTAL = data.partATotal;
    let aPct = null, aRaw = rec.partA;
    if (pending.has("partA")) waiting.push("Part A");
    else { aRaw = isNum(aRaw) ? aRaw : 0; aPct = r2(aRaw / A_TOTAL * 2.5); }
    let bPct = null, bRaw = rec.partB;
    if (pending.has("partB")) waiting.push("Part B");
    else { bRaw = isNum(bRaw) ? bRaw : 0; bPct = r2(bRaw / 10); }

    const chips = Object.entries(data.exercises).map(([ex, mx]) => {
      const wk = data.weeks && data.weeks[ex];
      const w = wk ? `<small>Wk ${wk}</small>` : "";
      const got = rec.ex && rec.ex[ex];
      if (!got) return `<span class="chip" title="${ex}${wk ? " (Wk " + wk + ")" : ""} · ยังไม่ได้ส่ง"><b>${ex}</b>${w}</span>`;
      const part = got !== mx;
      return `<span class="chip done${part ? " part" : ""}" title="${ex}${wk ? " (Wk " + wk + ")" : ""} · ได้ ${got}/${mx}"><b>${ex}${part ? ` · ${got}/${mx}` : ""}</b>${w}</span>`;
    }).join("");

    const raw = r2(base + (aPct || 0) + (bPct || 0));
    const counted = Math.min(45, raw);
    const fromBonus = Math.max(0, counted - Math.min(base, 45));
    const seg = (x, col) => `<i style="width:${(Math.max(0, x) / 45 * 100).toFixed(2)}%;background:${col}"></i>`;
    const pv = (p) => p === null ? '<span class="pend">รอ</span>' : `<b>${fmt(p)}</b>`;

    $("#summary").innerHTML = `
      <div class="card sum">
        <div class="sum-top"><div class="who">${esc(code)} <small>· Section ${esc(rec.g)}</small></div>
          ${rec.demo ? '<span class="demo">ตัวอย่าง · ไม่ใช่คะแนนจริง</span>' : `<span class="stamp">อัปเดต ${esc(thaiDate(data.updated))}</span>`}</div>
        <div class="bigrow"><div class="big">${fmt(counted)} <small>/ 45</small></div>
          <div class="lbl">คะแนนเก็บ อาจารย์ไทย<br>รวม Bonus แล้ว</div></div>
        <div class="bar">${seg(Math.min(base, 45), "var(--blue)")}${seg(fromBonus, "var(--violet)")}</div>
        <div class="eq">${fmt(base)} + Part A ${pv(aPct)} + Part B ${pv(bPct)} = <b>${fmt(raw)}</b>${raw > 45 ? " → นับเต็ม 45" : " (สูงสุด 45)"}</div>
        ${waiting.length ? `<div class="wait-line">⏳ รอคะแนน: ${waiting.map(esc).join(" · ")}</div>` : ""}
      </div>`;

    $("#detail").innerHTML = `
      <div class="sec">คะแนนเก็บ <small>เต็ม 45</small></div>
      <div class="tiles">${tiles}</div>
      <div class="card bonus">
        <div class="b-row"><div class="b-name" title="คะแนนที่ได้ ÷ ${A_TOTAL} × 2.5">Bonus Part A<small>แบบฝึกหัดเพิ่มเติม</small></div>
          <div class="b-val">${aPct === null ? '<span class="pend">รอบันทึก</span>' : `${fmt(aRaw)}<small> / ${A_TOTAL}</small> → <span class="plus">+${fmt(aPct)}</span>`}</div></div>
        <div class="chips">${chips}</div>
        <div class="b-row"><div class="b-name" title="คะแนนที่ได้ ÷ 10">Bonus Part B<small>AI Projects</small></div>
          <div class="b-val">${bPct === null ? '<span class="pend">รอบันทึก</span>' : `${fmt(bRaw)}<small> / 75</small> → <span class="plus">+${fmt(bPct)}</span>`}</div></div>
      </div>`;
    $("#layout").classList.add("has-result");
  }

  function clearResult() {
    $("#summary").innerHTML = ""; $("#detail").innerHTML = "";
    $("#layout").classList.remove("has-result");
  }

  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const n = normalise($("#code").value);
    if (n.err) { msg(n.err); clearResult(); return; }
    $("#code").value = n.code;
    if (!(window.crypto && crypto.subtle)) { msg("เบราว์เซอร์นี้เปิดคะแนนไม่ได้ ลองเปิดลิงก์ใน Chrome หรือ Safari ค่ะ"); return; }
    msg("กำลังเปิดคะแนน…"); $("#go").disabled = true;
    try {
      const data = await loadData();
      const rec = await openRecord(data, n.code);
      if (!rec) { msg(`ไม่พบ ${n.code} ค่ะ ลองตรวจ Code อีกครั้ง ถ้ายังไม่เจอ ทักอาจารย์ทาง Teams chat`); clearResult(); return; }
      msg(""); render(data, n.code, rec);
      $("#code").blur();
    } catch (err) {
      console.error(err);
      msg("โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าแล้วกดอีกครั้งค่ะ");
    } finally { $("#go").disabled = false; }
  });

  loadData().then((d) => {
    const el = $("#updated");
    el.textContent = "🕒 อัปเดตล่าสุด " + thaiDate(d.updated);
    el.hidden = false;
  }).catch(() => {});

  // Test hook: GE5072Score.lookup("S-XXXX")
  window.GE5072Score = { lookup: async (c) => { const d = await loadData(); return openRecord(d, normalise(c).code); }, normalise };
})();
</script>
</body>
</html>
